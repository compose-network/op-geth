name: Local Testnet

on:
  push:
    branches:
      - main
      - ci-cd-poc
  pull_request:
  workflow_dispatch:

jobs:
  run-testnet:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24-dind
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""

    steps:
      - name: Checkout op-geth repository
        uses: actions/checkout@v4
        with:
          path: op-geth

      - name: Checkout local-testnet repository
        uses: actions/checkout@v4
        with:
          repository: compose-network/local-testnet
          path: local-testnet

      - name: Set up Docker CLI
        run: |
          # Install Docker CLI
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y docker-ce-cli docker-compose-plugin

      - name: Configure Docker to use DinD service
        run: |
          export DOCKER_HOST=tcp://localhost:2375
          docker version
          docker compose version

      - name: Run local testnet
        working-directory: local-testnet
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: make run-l2
