name: Local Testnet

on:
  push:
    branches:
      - main
      - ci-cd-poc
  pull_request:
  workflow_dispatch:

jobs:
  run-testnet:
    runs-on: public-isolated
    steps:
      - name: Checkout op-geth repository
        uses: actions/checkout@v4
        with:
          path: op-geth

      - name: Checkout local-testnet repository
        uses: actions/checkout@v4
        with:
          repository: compose-network/local-testnet
          path: local-testnet

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Install jq
        run: |
          # Install jq to user's local bin without needing root
          mkdir -p $HOME/.local/bin
          curl -L https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o $HOME/.local/bin/jq
          chmod +x $HOME/.local/bin/jq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          # Install Docker Compose V2 plugin if not already installed
          if ! docker compose version &> /dev/null; then
            echo "Installing Docker Compose..."
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p $DOCKER_CONFIG/cli-plugins
            curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
            chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          fi

      - name: Verify all tools
        run: |
          echo "=== Go ==="
          go version
          echo "=== Foundry ==="
          forge --version
          cast --version
          anvil --version
          echo "=== Just ==="
          just --version
          echo "=== jq ==="
          jq --version
          echo "=== Make ==="
          make --version
          echo "=== Git ==="
          git --version
          echo "=== Docker ==="
          docker version
          docker buildx version
          docker compose version

      - name: Run local testnet
        working-directory: local-testnet
        run: make run-l2
