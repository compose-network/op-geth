name: Local Testnet

on:
  push:
    branches:
      - main
      - ci-cd-poc
  pull_request:
  workflow_dispatch:

jobs:
  run-testnet:
    runs-on:
      group: public-isolated
      labels: [self-hosted, public, isolated]

    steps:
      - name: Checkout op-geth repository
        uses: actions/checkout@v4
        with:
          path: op-geth

      - name: Checkout local-testnet repository
        uses: actions/checkout@v4
        with:
          repository: compose-network/local-testnet
          path: local-testnet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Verify Docker setup
        run: |
          docker version
          docker compose version
          docker info

      - name: Run local testnet
        working-directory: local-testnet
        run: make run-l2
